name: ci

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: pip install build
      - run: python -m build --wheel
      - run: python -c "import glob, zipfile; p=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(p); assert 'alertscope/static/index.html' in z.namelist()"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: |
          for c in charts/*/; do
            helm lint "$c" -f "gitops/values/$(basename "$c").yaml"
            helm template x "$c" -f "gitops/values/$(basename "$c").yaml" > /dev/null
          done

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/local/docker-compose.yml config --quiet

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [infra/gcp, infra/aws]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
