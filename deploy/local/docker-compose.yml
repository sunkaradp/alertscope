# Local playground: breaker -> prometheus/loki -> alertmanager -> alertscope
# make up, then: curl -XPOST 'localhost:8000/mode?m=errors'
name: alertscope

services:
  breaker:
    build: ../../demo/breaker
    container_name: breaker
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 300m
    restart: unless-stopped

  alertscope:
    build: ../../app
    container_name: alertscope
    ports: ["127.0.0.1:8080:8080"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      ALERTSCOPE_PROMETHEUS_URL: http://prometheus:9090
      ALERTSCOPE_LOKI_URL: http://loki:3100
      ALERTSCOPE_COOLDOWN_MINUTES: "5"
      ALERTSCOPE_LOKI_LABELS: '["container"]'
      # stub works with no credentials; set bedrock or vertex in ../../.env
      ALERTSCOPE_LLM_PROVIDER: ${ALERTSCOPE_LLM_PROVIDER:-stub}
    volumes:
      - ${HOME}/.aws:/home/app/.aws:ro
      - ${HOME}/.config/gcloud:/home/app/.config/gcloud:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.external-url=http://localhost:9090

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  loki:
    image: grafana/loki:3.5.3
    ports: ["127.0.0.1:3100:3100"]
    command: -config.file=/etc/loki/local-config.yaml

  alloy:
    image: grafana/alloy:v1.10.0
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run /etc/alloy/config.alloy

  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-alertscope-password}
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../../charts/alertscope/dashboards:/var/lib/grafana/dashboards:ro
