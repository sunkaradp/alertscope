# Local playground: breaker -> prometheus/loki -> alertmanager -> alertscope
# make up, then: curl -XPOST 'localhost:8000/mode?m=errors'
name: alertscope

services:
  breaker:
    build: ../../demo/breaker
    container_name: breaker
    ports: ["127.0.0.1:8000:8000"]
    mem_limit: 300m
    restart: unless-stopped

  storage-init:
    image: busybox:1.37
    user: "0:0"
    command: sh -c "mkdir -p /data && chown -R 10001:10001 /data"
    volumes:
      - alertscope-data:/data
    restart: "no"

  alertscope:
    build: ../../app
    depends_on:
      storage-init:
        condition: service_completed_successfully
      tempo:
        condition: service_started
    container_name: alertscope
    ports: ["127.0.0.1:8080:8080"]
    env_file:
      - path: ../../.env
        required: false
    environment:
      ALERTSCOPE_PROMETHEUS_URL: http://prometheus:9090
      ALERTSCOPE_LOKI_URL: http://loki:3100
      ALERTSCOPE_DATABASE_PATH: /data/alertscope.db
      ALERTSCOPE_COOLDOWN_MINUTES: "5"
      ALERTSCOPE_LOKI_LABELS: '["container"]'
      # stub works with no credentials; set bedrock or vertex in ../../.env
      ALERTSCOPE_LLM_PROVIDER: ${ALERTSCOPE_LLM_PROVIDER:-stub}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_SERVICE_NAME: alertscope
    volumes:
      - alertscope-data:/data
      - ${HOME}/.aws:/home/app/.aws:ro
      - ${HOME}/.config/gcloud:/home/app/.config/gcloud:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.external-url=http://localhost:9090

  alertmanager:
    image: prom/alertmanager:v0.28.1
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  loki:
    image: grafana/loki:3.5.3
    ports: ["127.0.0.1:3100:3100"]
    command: -config.file=/etc/loki/local-config.yaml

  alloy:
    image: grafana/alloy:v1.10.0
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: run /etc/alloy/config.alloy

  node-exporter:
    image: prom/node-exporter:v1.9.1
    ports: ["127.0.0.1:9100:9100"]
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    ports: ["127.0.0.1:8081:8080"]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  tempo-init:
    image: busybox:1.37
    user: "0:0"
    command: sh -c "mkdir -p /var/tempo && chown -R 10001:10001 /var/tempo"
    volumes:
      - tempo-data:/var/tempo
    restart: "no"

  tempo:
    image: grafana/tempo:2.8.2
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    command: -config.file=/etc/tempo.yaml
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-alertscope-password}
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../../charts/alertscope/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  alertscope-data:
  tempo-data:
