groups:
  - name: breaker
    rules:
      - alert: BreakerHighErrorRate
        expr: |
          sum(rate(breaker_http_requests_total{code=~"5.."}[1m]))
            / sum(rate(breaker_http_requests_total[1m])) > 0.1
        for: 30s
        labels: {severity: warning, container: breaker}
        annotations:
          summary: More than 10% of order requests are failing

      - alert: BreakerDown
        expr: up{job="breaker"} == 0
        for: 15s
        labels: {severity: critical, container: breaker}
        annotations:
          summary: breaker is not answering scrapes

      - alert: BreakerMemoryHigh
        expr: breaker_hoard_bytes > 150 * 1024 * 1024
        for: 10s
        labels: {severity: warning, container: breaker}
        annotations:
          summary: breaker memory keeps growing, container limit is 300Mi

  - name: infrastructure
    rules:
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: node-exporter scrape target is unavailable

      - alert: ContainerMetricsUnavailable
        expr: up{job="cadvisor"} == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: cAdvisor scrape target is unavailable

      - alert: NodeHighCPU
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: node CPU utilisation has remained above 85 percent for 5 minutes

      - alert: NodeHighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: node memory utilisation has remained above 90 percent for 5 minutes

      - alert: NodeFilesystemLowSpace
        expr: 100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 85
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: node filesystem utilisation is above 85 percent
