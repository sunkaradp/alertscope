global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files: [rules.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: breaker
    static_configs: [{targets: ["breaker:8000"]}]
  - job_name: alertscope
    metrics_path: /metrics/
    static_configs: [{targets: ["alertscope:8080"]}]
