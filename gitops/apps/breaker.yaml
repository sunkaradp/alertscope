apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: breaker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sunkaradp/alertscope.git
    targetRevision: main
    path: charts/breaker
    helm:
      valueFiles: [../../gitops/values/breaker.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
